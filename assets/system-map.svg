<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" role="img" aria-hidden="true" focusable="false">
  <title>Conceptual illustration of a layered backend request flow: a client request passes through an API gateway to backend APIs, which dispatch to a payments service and an event bus, backed by a database and cache, all running on cloud infrastructure</title>
  <defs>
    <marker id="tm-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f9cff"/>
    </marker>
    <linearGradient id="tm-line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9cff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style>
    .tm-dot { offset-distance: 0%; animation: tm-travel 3.6s ease-in-out infinite; }
    @keyframes tm-travel {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .tm-dot { animation: none; opacity: 0.9; }
    }
  </style>

  <rect x="10" y="52" width="440" height="430" rx="20" fill="none" stroke="#4f9cff" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 5"/>

  <g>
    <rect x="24" y="36" width="104" height="30" rx="15" fill="#0d1b2a" stroke="#4f9cff" stroke-opacity="0.5" stroke-width="1.2"/>
    <svg x="36" y="43" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4f9cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9z"/>
    </svg>
    <text x="60" y="55" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#f8fafc">Cloud</text>
  </g>

  <g fill="none" stroke="url(#tm-line)" stroke-width="1.8" stroke-linecap="round" marker-end="url(#tm-arrow)">
    <path d="M230,122 L230,156"/>
    <path d="M230,206 L230,240"/>
    <path d="M230,290 Q175,312 116,328"/>
    <path d="M230,290 Q285,312 344,328"/>
    <path d="M116,374 L116,412"/>
    <path d="M344,374 L344,412"/>
  </g>
  <path d="M186,435 L274,435" fill="none" stroke="#4f9cff" stroke-opacity="0.4" stroke-width="1.4" stroke-dasharray="4 5" stroke-linecap="round"/>

  <g class="tm-dot" style="offset-path: path('M230,122 L230,156'); animation-delay: 0s;"><circle r="3.2" fill="#4f9cff"/></g>
  <g class="tm-dot" style="offset-path: path('M230,206 L230,240'); animation-delay: 0.5s;"><circle r="3.2" fill="#38bdf8"/></g>
  <g class="tm-dot" style="offset-path: path('M230,290 Q175,312 116,328'); animation-delay: 1s;"><circle r="3.2" fill="#4f9cff"/></g>
  <g class="tm-dot" style="offset-path: path('M230,290 Q285,312 344,328'); animation-delay: 1.1s;"><circle r="3.2" fill="#38bdf8"/></g>
  <g class="tm-dot" style="offset-path: path('M116,374 L116,412'); animation-delay: 1.6s;"><circle r="3.2" fill="#4f9cff"/></g>
  <g class="tm-dot" style="offset-path: path('M344,374 L344,412'); animation-delay: 1.7s;"><circle r="3.2" fill="#38bdf8"/></g>

  <g transform="translate(160,76)">
    <rect width="140" height="46" rx="12" fill="#10243a" stroke="#94a3b8" stroke-opacity="0.4"/>
    <rect x="13" y="12" width="20" height="14" rx="2" fill="none" stroke="#4f9cff" stroke-width="1.8"/>
    <line x1="19" y1="29" x2="27" y2="29" stroke="#4f9cff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="23" y1="26" x2="23" y2="29" stroke="#4f9cff" stroke-width="1.8"/>
    <text x="46" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Client</text>
  </g>

  <g transform="translate(160,160)">
    <rect width="140" height="46" rx="12" fill="#10243a" stroke="#94a3b8" stroke-opacity="0.4"/>
    <path d="M23 11 L31 14 V21 C31 26 27.5 29.5 23 31 C18.5 29.5 15 26 15 21 V14 Z" fill="none" stroke="#4f9cff" stroke-width="1.8" stroke-linejoin="round" transform="translate(-4,-3)"/>
    <text x="46" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Gateway</text>
  </g>

  <g transform="translate(160,244)">
    <rect width="140" height="46" rx="12" fill="#10243a" stroke="#94a3b8" stroke-opacity="0.4"/>
    <path d="M18 15 L11 23 L18 31 M30 15 L37 23 L30 31" fill="none" stroke="#4f9cff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="46" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">APIs</text>
  </g>

  <g transform="translate(46,328)">
    <rect width="140" height="46" rx="12" fill="#10243a" stroke="#94a3b8" stroke-opacity="0.4"/>
    <rect x="12" y="12" width="24" height="17" rx="3" fill="none" stroke="#4f9cff" stroke-width="2"/>
    <line x1="12" y1="18" x2="36" y2="18" stroke="#4f9cff" stroke-width="2"/>
    <text x="46" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Payments</text>
  </g>

  <g transform="translate(274,328)">
    <rect width="140" height="46" rx="12" fill="#10243a" stroke="#94a3b8" stroke-opacity="0.4"/>
    <path d="M25 10 L15 24 h8 l-4 12 14-16h-8l4-10Z" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="46" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Events</text>
  </g>

  <g transform="translate(46,412)">
    <rect width="140" height="46" rx="12" fill="#10243a" stroke="#94a3b8" stroke-opacity="0.4"/>
    <ellipse cx="24" cy="16" rx="8.5" ry="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M15.5 16v8c0 2.2 3.8 4 8.5 4s8.5-1.8 8.5-4v-8" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M15.5 20c0 2.2 3.8 4 8.5 4s8.5-1.8 8.5-4" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="46" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Data</text>
  </g>

  <g transform="translate(274,412)">
    <rect width="140" height="46" rx="12" fill="#10243a" stroke="#94a3b8" stroke-opacity="0.4"/>
    <rect x="13" y="11" width="8" height="8" rx="1.5" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="25" y="11" width="8" height="8" rx="1.5" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="13" y="23" width="8" height="8" rx="1.5" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="25" y="23" width="8" height="8" rx="1.5" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="46" y="29" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Cache</text>
  </g>
</svg>
