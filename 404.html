<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
<meta charset="UTF-8">
<script>
(function(){
  try {
    document.documentElement.classList.replace('no-js', 'js');
    var stored = localStorage.getItem('theme');
    var theme = stored === 'light' || stored === 'dark' ? stored : null;
    if (!theme) {
      theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
  // If main.js never runs (blocked, failed, parse error) restore the scriptless
  // navigation fallback so the menu stays reachable.
  document.addEventListener('DOMContentLoaded', function () {
    var r = document.documentElement;
    if (!r.classList.contains('nav-ready')) r.classList.add('js-failed');
  });
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Avinash Kumar</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="/" aria-label="AK, home">AK</a>
    <div class="header-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <span class="theme-toggle-label">Dark</span>
      </button>
    </div>
  </div>
</header>

<main id="main" class="notfound">
  <div class="section-inner notfound-inner">
    <p class="eyebrow">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you’re looking for doesn’t exist or may have moved.</p>
    <a class="btn btn-primary" href="/">Back to home</a>
  </div>
</main>

<script src="/js/main.js" defer></script>
</body>
</html>
